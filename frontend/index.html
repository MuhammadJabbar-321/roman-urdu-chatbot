<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roman Urdu Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f3ef;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 85vh;
    overflow: hidden;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #f1f1f1; color: #111; border-bottom-left-radius: 4px; }
  .status { align-self: center; font-size: 12px; color: #888; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid #eee;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
    font-size: 15px;
  }
  button {
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn { background: #2563eb; color: #fff; }
  #micBtn { background: #f1f1f1; }
  #micBtn.recording { background: #ef4444; color: #fff; }
</style>
</head>
<body>

<div class="app">
  <header>Roman Urdu Chatbot</header>
  <div id="chat"></div>
  <form id="chatForm">
    <button type="button" id="micBtn" title="Record voice">🎤</button>
    <input type="text" id="textInput" placeholder="Kuch likho... (Roman Urdu)" autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
// Change this if your backend runs on a different host/port
const API_BASE = "http://localhost:8000";

const chatEl = document.getElementById("chat");
const form = document.getElementById("chatForm");
const textInput = document.getElementById("textInput");
const micBtn = document.getElementById("micBtn");

let history = []; // {role, content} pairs sent to the backend for context

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addStatus(text) {
  const div = document.createElement("div");
  div.className = "status";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function sendToBot(userText) {
  addMessage(userText, "user");
  history.push({ role: "user", content: userText });
  const statusEl = addStatus("Typing...");

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: userText, history: history.slice(-10) }),
    });
    const data = await res.json();
    statusEl.remove();
    addMessage(data.reply, "bot");
    history.push({ role: "assistant", content: data.reply });
    playReply(data.reply);
  } catch (err) {
    statusEl.textContent = "Error: could not reach backend. Is it running?";
    console.error(err);
  }
}

async function playReply(text) {
  try {
    const res = await fetch(`${API_BASE}/speak`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
  } catch (err) {
    console.error("TTS failed:", err);
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = "";
  sendToBot(text);
});

// ---------------- Voice input (recording) ----------------
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

micBtn.addEventListener("click", async () => {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        const statusEl = addStatus("Transcribing...");

        const formData = new FormData();
        formData.append("file", audioBlob, "recording.webm");

        try {
          const res = await fetch(`${API_BASE}/transcribe`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          statusEl.remove();
          if (data.text && data.text.trim()) {
            sendToBot(data.text.trim());
          } else {
            addStatus("Kuch sunai nahi diya, dobara try karo.");
          }
        } catch (err) {
          statusEl.textContent = "Transcription failed.";
          console.error(err);
        }
      };

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
    } catch (err) {
      alert("Microphone access denied or unavailable.");
      console.error(err);
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach((t) => t.stop());
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  }
});
</script>

</body>
</html>
